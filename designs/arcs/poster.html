<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bring one question</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&display=swap" rel="stylesheet">
<style>
  :root {
    --u: 1vmin;
    --margin: calc(7 * var(--u));
    --paper: #FAF8F2;
    --ink: #3D3C38;
    --orange: #FF612B;
    --teal: #095F87;
  }
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: var(--paper); }
  .poster {
    position: relative; width: 100vw; height: 100vh; overflow: hidden;
    background: var(--paper); color: var(--ink);
    font-family: "Figtree", sans-serif;
  }

  /* one tight block, flush left; its last headline line ends on the full stop the arcs grow from */
  .block {
    position: absolute;
    left: var(--margin);
    top: calc(90.6 * var(--u));
    margin: 0;
  }
  .head {
    margin: 0;
    font-weight: 800; font-size: calc(7.4 * var(--u)); line-height: 0.9;
    letter-spacing: -0.035em;
  }
  .head span { display: block; white-space: nowrap; }
  /* the full stop: a disc drawn on the baseline, the centre of every arc */
  .stop {
    position: relative; display: inline-block; vertical-align: baseline;
    width: 0.3em; height: 0.3em; margin-left: 0.075em;
    border-radius: 50%; background: var(--orange);
  }
  .arcs {
    position: absolute; left: 50%; top: 50%;
    width: calc(520 * var(--u)); height: calc(520 * var(--u));
    transform: translate(-50%, -50%);
    overflow: visible; pointer-events: none;
  }
  .arcs * { fill: none; stroke: var(--orange); stroke-linecap: butt; }
  .line {
    margin: calc(2.6 * var(--u)) 0 0;
    font-family: "Newsreader", serif; font-style: italic; font-weight: 400;
    font-size: calc(2.9 * var(--u)); line-height: 1.12; letter-spacing: -0.005em;
  }
  .line span { display: block; white-space: nowrap; }
  .facts {
    margin: calc(2.4 * var(--u)) 0 0;
    font-weight: 600; font-size: calc(1.9 * var(--u)); line-height: 1.28;
  }
  .facts span { display: block; white-space: nowrap; }
  .facts .kind { font-weight: 700; color: var(--teal); }
</style>
</head>
<body>
<main class="poster">
  <div class="block">
    <h1 class="head">
      <span>Bring</span>
      <span>one</span>
      <span>question<i class="stop" data-decor><svg class="arcs" data-decor viewBox="-260 -260 520 520" aria-hidden="true">
        <path d="M-0.000 -3.800A3.800 3.800 0 0 1 3.671 0.984" stroke-width="1.520"/>
        <path d="M-0.530 -7.581A7.600 7.600 0 0 1 5.822 4.885" stroke-width="3.040"/>
        <path d="M-2.639 -14.969A15.200 15.200 0 0 1 6.424 13.776" stroke-width="6.080"/>
        <path d="M-9.897 -28.744A30.400 30.400 0 1 1 0.000 30.400" stroke-width="12.160"/>
        <path d="M-32.668 -51.278A60.800 60.800 0 1 1 -25.695 55.104" stroke-width="24.320"/>
        <path d="M-96.794 -73.604A121.600 121.600 0 1 1 -93.151 78.163" stroke-width="48.640"/>
      </svg></i></span>
    </h1>
    <p class="line"><span>Ask anything.</span><span>We answer in the room.</span></p>
    <p class="facts"><span class="kind">Town hall</span><span>Thursday 4 December</span><span>3 pm</span><span>Training Room B</span></p>
  </div>
</main>
</body>
</html>
