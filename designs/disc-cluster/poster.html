<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thank you, team.</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&display=swap" rel="stylesheet">
<style>
:root{
  --u:1vmin;
  --margin:calc(7*var(--u));
  --cols:6;
  --paper:#FAF8F2;
  --ink:#3D3C38;
  --orange:#FF612B;
  --deep:#D8420C;
}
html,body{margin:0;width:100vw;height:100vh;overflow:hidden}
.poster{position:relative;width:100vw;height:100vh;overflow:hidden;background:var(--paper);color:var(--ink)}

/* the cluster: seven discs, one shape */
.cluster{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.cluster .one{fill:var(--orange)}
.cluster .two{fill:var(--deep)}

/* headline: stacked hard against the foot, flush with the left axis */
.head{
  position:absolute;
  left:calc(7*var(--u));
  bottom:calc(7.9*var(--u));
  margin:0;
  font-family:Figtree,sans-serif;
  font-weight:900;
  font-size:calc(31*var(--u));
  line-height:.93;
  letter-spacing:-.05em;
  text-indent:-.02em;
}
.head span{display:block}
/* "you," has no ascenders and "Thank" no descenders: close that gap by eye */
.head span:nth-child(2){margin-top:-.22em}

/* supporting line: a narrow column in the opposite corner, same left axis */
.line{
  position:absolute;
  left:calc(7*var(--u));
  top:calc(7*var(--u));
  width:calc(24*var(--u));
  margin:0;
  font-family:Newsreader,serif;
  font-style:italic;
  font-weight:500;
  font-size:calc(2.2*var(--u));
  line-height:1.24;
  letter-spacing:.002em;
}
.line span{display:block}
</style>
</head>
<body>
<main class="poster">

  <svg class="cluster" data-decor aria-hidden="true" viewBox="0 0 100 141.3" preserveAspectRatio="xMidYMid slice">
    <defs>
      <circle id="a" cx="82" cy="14" r="30"/>
      <circle id="b" cx="50" cy="32" r="20"/>
      <circle id="c" cx="88" cy="54" r="19"/>
      <circle id="e" cx="27" cy="40" r="11"/>
      <circle id="f" cx="38" cy="12" r="8"/>
      <clipPath id="ka"><use href="#a"/></clipPath>
      <clipPath id="kb"><use href="#b"/></clipPath>
      <clipPath id="kc"><use href="#c"/></clipPath>
      <clipPath id="ke"><use href="#e"/></clipPath>
    </defs>
    <g class="one">
      <use href="#a"/><use href="#b"/><use href="#c"/><use href="#e"/><use href="#f"/>
    </g>
    <g class="two">
      <g clip-path="url(#ka)"><use href="#b"/><use href="#c"/><use href="#e"/><use href="#f"/></g>
      <g clip-path="url(#kb)"><use href="#c"/><use href="#e"/><use href="#f"/></g>
      <g clip-path="url(#kc)"><use href="#e"/><use href="#f"/></g>
      <g clip-path="url(#ke)"><use href="#f"/></g>
    </g>
  </svg>

  <p class="line">
    <span>For every call</span>
    <span>you stayed on</span>
    <span>until it was fixed.</span>
  </p>

  <h1 class="head">
    <span>Thank</span>
    <span>you,</span>
    <span>team.</span>
  </h1>

</main>
</body>
</html>
