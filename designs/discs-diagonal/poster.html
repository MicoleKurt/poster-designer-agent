<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Listen first. Then solve.</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&display=swap" rel="stylesheet">
<style>
:root{
  --u:1vmin;
  --paper:#FAF8F2; --ink:#3D3C38; --orange:#FF612B; --teal:#095F87;
  /* grid: 7u margins, three 26u columns, 4u gutters */
  --m:calc(7*var(--u)); --col:calc(26*var(--u)); --gut:calc(4*var(--u));
}
html,body{margin:0;width:100vw;height:100vh;overflow:hidden;background:var(--paper)}
.poster{position:relative;width:100vw;height:100vh;overflow:hidden;background:var(--paper);color:var(--ink);font-family:'Figtree',sans-serif}
.discs{position:absolute;left:0;top:0;width:calc(100*var(--u));height:calc(141.3*var(--u));display:block}
.discs circle{fill:var(--orange)}

.foot{position:absolute;left:var(--m);right:var(--m);top:calc(102.54*var(--u));bottom:var(--m);
  display:grid;grid-template-columns:repeat(3,var(--col));column-gap:var(--gut);
  grid-template-rows:auto auto 1fr}
.h{grid-row:1;margin:0;font-weight:800;font-size:calc(7.6*var(--u));line-height:.92;letter-spacing:-.035em}
.h1{grid-column:1}.h2{grid-column:3}
.pt{grid-row:2;margin:calc(5.2*var(--u)) 0 0;font-family:'Newsreader',serif;font-weight:400;font-size:calc(2.5*var(--u));line-height:1.2;letter-spacing:-.005em}
.p1{grid-column:1}.p2{grid-column:2}.p3{grid-column:3}
.kind{grid-column:1;grid-row:3;align-self:end;margin:0;font-weight:600;font-size:calc(1.4*var(--u));line-height:1;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
</style>
</head>
<body>
<main class="poster">
  <svg class="discs" data-decor aria-hidden="true" viewBox="0 0 100 141.3" preserveAspectRatio="none">
    <!-- centres on one 45-degree line; each disc a third of the last; equal 8.28u gaps;
         disc 2 and disc 3 stand on the left edges of text columns 2 and 3 (x=37, x=67) -->
    <circle cx="3.72" cy="21.72" r="45"/>
    <circle cx="52" cy="70" r="15"/>
    <circle cx="72" cy="90" r="5"/>
  </svg>

  <section class="foot">
    <h1 class="h h1">Listen<br>first.</h1>
    <p class="kind">Call habit</p>
    <h1 class="h h2">Then<br>solve.</h1>
    <p class="pt p1">Let the caller<br>finish.</p>
    <p class="pt p2">Say back what<br>you heard.</p>
    <p class="pt p3">Confirm the fix<br>before you close.</p>
  </section>
</main>
</body>
</html>
