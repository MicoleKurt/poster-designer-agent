<style>
  :root{--u:1vmin;--margin:calc(7*var(--u));--paper:#FAF8F2;--ink:#3D3C38;--orange:#FF612B}
  html,body{margin:0;width:100vw;height:100vh;overflow:hidden}
  .poster{position:relative;width:100vw;height:100vh;overflow:hidden;background:var(--paper);color:var(--ink);font-family:'Figtree',sans-serif}
  /* 60 strokes round an empty O: each one longer than the last, the longest leave the sheet */
  .burst{position:absolute;left:0;top:0;width:calc(100*var(--u));height:calc(141.3*var(--u))}
  .burst line{stroke:var(--orange);stroke-width:1.6;stroke-linecap:butt}
  /* five rows, one size, one weight, set from their baselines on a 29.85u pitch */
  .row{position:absolute;left:var(--margin);margin:0;line-height:1;white-space:nowrap;
    font-size:calc(5.6*var(--u));font-weight:900;letter-spacing:-0.02em}
  .r1{top:calc(8.42*var(--u))}
  .r2{top:calc(38.27*var(--u))}
  .r3{top:calc(68.12*var(--u))}
  .r4{top:calc(97.97*var(--u))}
  .r5{top:calc(127.82*var(--u))}
</style>
