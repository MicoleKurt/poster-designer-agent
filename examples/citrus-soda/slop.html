<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>What not to make</title>
<!-- The same brief as poster.html, made the way no decision gets made.
     Kept in the repo as a test case: check.py must fail it. -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&family=Pacifico&family=Montserrat:wght@600&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; }
  body { font-family: 'Poppins', sans-serif; color: #fff; text-align: center;
    background: linear-gradient(135deg, #6a11cb 0%, #a855f7 45%, #2575fc 100%); }
  .poster { width: 100vw; height: 100vh; padding: 3vmin; display: flex; flex-direction: column; align-items: center; justify-content: space-between; position: relative; }
  .blob { position: absolute; border-radius: 50%; filter: blur(6vmin); opacity: .6; }
  .b1 { width: 50vmin; height: 50vmin; background: #ff5fd2; left: -10vmin; top: 10vmin; }
  .b2 { width: 60vmin; height: 60vmin; background: #22d3ee; right: -15vmin; bottom: 15vmin; }
  .badge { position: absolute; right: 4vmin; top: 4vmin; width: 22vmin; height: 22vmin; border-radius: 50%; background: #ffe600; color: #d00;
    font-family: 'Bebas Neue'; font-size: 6vmin; display: flex; align-items: center; justify-content: center; transform: rotate(14deg); box-shadow: 0 0 4vmin #ffe600; }
  .new { position: absolute; left: 4vmin; top: 4vmin; background: #ff2d55; padding: 1vmin 3vmin; border-radius: 99px; font-family: 'Montserrat'; font-size: 2.6vmin; }
  h1 { font-size: 9vmin; font-weight: 900; text-shadow: 0 0 3vmin #fff, 0 0 6vmin #f0f; margin-top: 12vmin; text-transform: uppercase; }
  h1 span { color: #ffe600; }
  h2 { font-family: 'Pacifico'; font-size: 5.5vmin; text-shadow: 0 .5vmin 1vmin rgba(0,0,0,.5); }
  .card { width: 70vmin; padding: 4vmin; border-radius: 5vmin; background: rgba(255,255,255,.18); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,.4); }
  .can { font-size: 30vmin; line-height: 1; filter: drop-shadow(0 0 4vmin #fff); }
  p { font-size: 1.15vmin; opacity: .8; }
  .icons { display: flex; gap: 5vmin; font-size: 2.4vmin; text-shadow: 0 0 2vmin #000; }
  .icons div { display: flex; flex-direction: column; align-items: center; gap: 1vmin; }
  .icons i { font-style: normal; font-size: 6vmin; }
  .strip { width: 100%; background: rgba(0,0,0,.35); padding: 2vmin; font-size: 2.2vmin; border-radius: 2vmin; }
</style>
</head>
<body>
  <main class="poster">
    <div class="blob b1"></div><div class="blob b2"></div>
    <div class="new">✨ NEW ARRIVAL ✨</div>
    <div class="badge">50% OFF!</div>
    <h1>Kalamansi <span>Soda</span></h1>
    <h2>Taste the Refreshing Difference!</h2>
    <div class="card">
      <div class="can">🥤</div>
      <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit sed do eiusmod tempor.</p>
    </div>
    <div class="icons">
      <div><i>🍋</i>100% Natural</div>
      <div><i>⚡</i>Energy Boost</div>
      <div><i>🏆</i>#1 Rated</div>
    </div>
    <div class="strip">📞 000-000-0000 &nbsp; 🌐 www.yourwebsite.com &nbsp; 📍 Your Address Here</div>
  </main>
</body>
</html>
