<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Town hall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- Stand-ins for the brand's own typefaces -->
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;800&family=Newsreader:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  /* Profile: profiles/optum-callcenter.json (unofficial).
     Concept: the question mark is the picture. One giant serif-italic "?" stands
     inside the orange ring, because the ask is a question, not attendance.
     The pale sky band holds the facts needed to turn up, and nothing else.
     Made for the team chat: read on a phone in under 2 seconds. */
  :root {
    --u: 1vmin; --margin: calc(7 * var(--u)); --cols: 12; --gutter: calc(1.8 * var(--u));
    --ground: #faf8f2; --ink: #3d3c38; --accent: #ff612b; --tint: #dff3f9; --link: #095f87;
    --t-note: calc(2.3 * var(--u)); --t-body: calc(3.4 * var(--u)); --t-head: calc(14.5 * var(--u));
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: var(--ground); }
  body { font-family: 'Figtree', sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .poster { position: relative; width: 100vw; height: 100vh; overflow: hidden; padding: var(--margin);
    display: grid; grid-template-columns: repeat(var(--cols), 1fr); column-gap: var(--gutter); grid-template-rows: auto 1fr auto; }

  .band { position: absolute; left: 0; right: 0; bottom: 0; height: calc(31 * var(--u)); background: var(--tint); }
  .ring { position: absolute; width: calc(84 * var(--u)); aspect-ratio: 1; border-radius: 50%;
    border: calc(12.5 * var(--u)) solid var(--accent); right: calc(-27 * var(--u)); top: calc(15 * var(--u)); }
  .mark { position: absolute; right: calc(4.5 * var(--u)); top: calc(19 * var(--u));
    font-family: 'Newsreader', serif; font-style: italic; font-weight: 500; font-size: calc(74 * var(--u)); line-height: 1; color: var(--ink); }

  .kicker { grid-column: 1 / span 8; font-size: var(--t-note); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
  .head { grid-column: 1 / span 8; align-self: start; margin-top: calc(9 * var(--u)); position: relative; z-index: 2;
    font-size: var(--t-head); font-weight: 800; line-height: .92; letter-spacing: -.04em; }
  .facts { grid-column: 1 / span 12; align-self: end; position: relative; z-index: 2; list-style: none;
    display: grid; grid-template-columns: 1.25fr 1fr 1.35fr; column-gap: calc(3 * var(--u)); }
  .facts li { border-top: calc(.4 * var(--u)) solid var(--ink); padding-top: calc(1.5 * var(--u)); font-size: var(--t-body); font-weight: 700; line-height: 1.15; }
  .facts b { display: block; font-size: var(--t-note); font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--link); margin-bottom: calc(.7 * var(--u)); }
</style>
</head>
<body>
  <main class="poster">
    <div class="band" data-decor></div>
    <div class="ring" data-decor></div>
    <div class="mark" data-bleed aria-hidden="true">?</div>

    <p class="kicker">Team town hall</p>
    <h1 class="head">Bring<br>one<br>question.</h1>

    <ul class="facts">
      <li><b>When</b>Thursday 4 December</li>
      <li><b>Time</b>3:00 pm</li>
      <li><b>Where</b>14th floor, Training Room B</li>
    </ul>
  </main>
</body>
</html>
